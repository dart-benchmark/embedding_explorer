include: package:lints/recommended.yaml

analyzer:
  # tool/ holds build_runner builders that need build_modules, which has no
  # Dart 3.13-compatible release; it is build tooling, not app code.
  exclude:
    - tool/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    constant_identifier_names: ignore
    file_names: ignore
    library_prefixes: ignore
    non_constant_identifier_names: ignore
    no_leading_underscores_for_library_prefixes: ignore

linter:
  rules:
    - prefer_relative_imports
    - unawaited_futures
    - unnecessary_breaks
